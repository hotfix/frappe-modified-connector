name: Bug report
description: Something does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please remove shop URLs, credentials, customer names,
        addresses and email addresses from everything you paste below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem. Include the error message shown in ERPNext, if any.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: For import problems, describe the order (products, tax rates, payment class, totals) without personal data.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: frappe-version
    attributes:
      label: Frappe version
      placeholder: e.g. 16.x.y
    validations:
      required: true
  - type: input
    id: erpnext-version
    attributes:
      label: ERPNext version
      placeholder: e.g. 16.x.y
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: modified_connector version
      description: Release tag or commit hash.
    validations:
      required: true
  - type: input
    id: shop-version
    attributes:
      label: modified eCommerce version
      description: Version of the shop software, as shown in the shop admin.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The Modified Sync Log message, the Error Log traceback or the browser console output.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have removed credentials, shop URLs and personal data (names, addresses, email addresses) from this report.
          required: true
